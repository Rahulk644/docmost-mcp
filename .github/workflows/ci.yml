name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings rather than letting them accumulate.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache the registry and target dir — a cold Rust build is several minutes.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

  docker:
    name: docker build · runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A full build, not `docker build --check`. The Dockerfile COPYs the compiled
      # binary by name, so renaming the crate silently broke the image while every
      # cargo job stayed green — this job is what catches that class of break.
      - name: Build production image
        run: docker build --tag docmost-mcp:ci .

      # Proves the packaged binary actually runs, not merely that the layers built.
      - name: Verify packaged binary
        run: docker run --rm docmost-mcp:ci --help

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reports known advisories against Cargo.lock. Informational: a fresh
      # advisory against a transitive dep should surface loudly but must not
      # block an unrelated PR from merging.
      - uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
